<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Samba</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/styleAuth.css">
</head>
<body>
    <section>
        <div class="form-container">
            <div class="form-top">
                <img src="../assets/img/logoInteira.png">
            </div>
            <div class="form-mid">
                <h1>Bem-vindo de volta!</h1>
                <p>Faça login para continuar sua jornada</p>
            </div>
            <form id="form">
                <div class="input-container">
                    <label>E-mail</label>
                    <div class="input">
                        <input type="text" placeholder="seu@email.com" id="inEmail">
                        <p id="inEmailMsg" style="opacity: 0; color: red;">O email deve conter @ e 2 caracteres aṕos o .</p>
                    </div>
                </div>
                <div class="input-container">
                    <label>Senha</label>
                    <div class="input">
                        <input type="password" placeholder="*************" id="inPass">
                        <p id="inPassMsg" style="opacity: 0; color: red;">Senha deve conter pelo menos, 1 carater especial, 1 letra maiuscúla, 1 número e 8 caracteres</p>
                    </div>
                </div>
                <div class="errorMsg" id="errMsg">Usuário não encontrado!</div>
                <div class="form-btn-container">
                    <button class="form-btn" type="submit">Entrar</button>
                    <p>Não tem uma conta? <span onclick="window.location = './register.html'">Cadastre-se</span></p>
                </div>
            </form>

        </div>
    </section>
</body>
<script>


    let regPass = /^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/;
    let regEmail = /^[^@\t\r\n]+@[^@\t\r\n]+\.[^@\t\r\n]+$/;

    function isPassed(reg, value){
        let regex = reg;
        return regex.test(value);
    }

    function validate(values){
        let tests = []

        for(let i = 0; i < values.length; i++){
            tests.push(isPassed(values[i].reg, values[i].value))
        }

        return tests;
    }

    inEmail.addEventListener('input', () => {
        if(!isPassed(regEmail, String(inEmail.value))){
            inEmail.classList.add('wrongInput');
            inEmailMsg.style.opacity = '100'
        }else{
            inEmail.classList.remove('wrongInput');
            inEmailMsg.style.opacity = '0'
        }
    })

    inPass.addEventListener('input', () => {
        if(!isPassed(regPass, String(inPass.value))){
            inPass.classList.add('wrongInput');
            inPassMsg.style.opacity = '100'
        }else{
            inPass.classList.remove('wrongInput');
            inPassMsg.style.opacity = '0'
        }
    })

    let frm = document.getElementById('form');
    frm.addEventListener('submit', (e) => {
        let email = String(inEmail.value);
        let pass = String(inPass.value);  
        
        let values = [
            {
                reg:regPass,
                value: pass
            },
            {
                reg:regEmail,
                value: email
            }
        ]

        let isPassed = validate(values).every((el) => {
            return el == true;
        });

        if(isPassed){
            login(email, pass);
        }else{
            console.log(isPassed);
        }

        e.preventDefault()
    })

    async function login(email, password){
        try {
            let response = await fetch('/usuarios/autenticar', {
                method:'POST',
                headers:{
                    "Content-Type": "application/json"
                },
                body:JSON.stringify({
                    emailServer: email,
                    senhaServer: password
                })
            })
            if(response.ok){
                let data = await response.json();
                console.log(data)
                sessionStorage.setItem('userId', data.id);
                sessionStorage.setItem('username', data.name);

                setTimeout(() => {
                    window.location = '../quiz/'
                }, 2000)
            }else{
                errMsg.style.opacity = 1;
            }
        } catch (err) {
            console.log(err);
        }
    }
</script>
</html>
