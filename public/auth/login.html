<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Samba</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/styleAuth.css">
</head>
<body>
    <section>
        <div class="form-container">
            <div class="form-top">
                <h1>TAMARINEIRA</h1>
                <h2>QUIZ</h2>
            </div>
            <div class="form-mid">
                <h1>Bem-vindo de volta!</h1>
                <p>Faça login para continuar sua jornada<br>pelo mundo do samba</p>
            </div>
            <form>
                <div class="input-container">
                    <label>E-mail</label>
                    <div class="input">
                        <input type="text" placeholder="seu@email.com">
                        <img src="">
                    </div>
                </div>
                <div class="input-container">
                    <label>Senha</label>
                    <div class="input">
                        <input type="password" placeholder="*************">
                        <img src="">
                    </div>
                </div>
                <div class="form-btn-container">
                    <button class="form-btn" type="submit">Entrar</button>
                </div>
            </form>

            <p>Não tem uma conta? <span>Cadastre-se</span></p>
        </div>
    </section>
</body>
</html>
