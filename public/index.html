<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">
    <title>Tamarineira</title>
</head>
<body>
   <main>
        <section id="sec1">
            <div class="content">
                <div class="command-container">
                    <p>PRESSIONE QUALQUER TECLA</p>
                    <div class="img"><img src="./assets/img/keyboard.svg" style="stroke: white;"></div>
                </div>
                <div class="title-container">
                    <h1 class="title">O SAMBA</h1>
                    <h2 class="subtitle">É A NOSSA HISTÓRIA</h2>
                </div>
                <div class="subtitle-container">
                    <p>Uma jornada interativa pela memória do samba moderno</p>
                    <p>Explore décadas, descubra histórias e faça parte dessa construção</p>
                </div>
            </div>
        </section>
        <section class="none" id="sec2">
                <div class="top">
                    <div class="logo">
                        <img src="./assets/img/logo.png">
                        <div class="title-top">
                            <p class="title-top-1">LINHA DO TEMPO</p>
                            <p>NAVEGUE PELA HISTÓRIA</p>
                        </div>
                    </div>
                    <div class="separate">
                        <img src="./assets/img/particao.svg">
                    </div>
                    <div class="authBtn-container">
                        <button class="authBtn" id="login" onclick="window.location.href = './auth/login.html'"><img src="./assets/img/login.svg">LOGIN</button>
                        <button class="authBtn" id="register" onclick="window.location.href = './auth/register.html'"><img src="./assets/img/register.svg">CADASTRE-SE</button>
                    </div>
                </div>

                <div class="cards" id="cards-container">
                    <!--  Aqui ficarão os cards  -->
                </div>

                <div class="modal-background none" id="modalBackground" onclick="closeModal()">
                    <!--  Aqui ficarão as janelas modais -->
                </div>
        </section>
        <div class="curtain"></div>
    </main>
</body>
<script src="./scripts/animation.js"></script>
<script>
    let cards = [
    {
        "id": "card1970",
        "decada": 1970,
        "titulo": "1970",
        "subtitulo": "O NASCIMENTO DE UM MOVIMENTO",
        "botao": {
        "texto": "EXPLORAR DÉCADA",
        "icone": "./assets/img/arrow-right.svg",
        "acao": "openModal(0)"
        }
    },
    {
        "id": "card1980",
        "decada": 1980,
        "titulo": "1980",
        "subtitulo": "A CONSOLIDAÇÃO DAS ESCOLAS",
        "botao": {
        "texto": "EXPLORAR DÉCADA",
        "icone": "./assets/img/arrow-right.svg",
        "acao": "openModal(1)"
        }
    },
    {
        "id": "card1990",
        "decada": 1990,
        "titulo": "1990",
        "subtitulo": "A ERA DOS FESTIVAIS",
        "botao": {
        "texto": "EXPLORAR DÉCADA",
        "icone": "./assets/img/arrow-right.svg",
        "acao": "openModal(2)"
        }
    },
    {
        "id": "card2000",
        "decada": 2000,
        "titulo": "2000",
        "subtitulo": "O SAMBA CHEGA AO NOVO MILÊNIO",
        "botao": {
        "texto": "EXPLORAR DÉCADA",
        "icone": "./assets/img/arrow-right.svg",
        "acao": "openModal(3)"
        }
    },
    {
        "id": "card2010",
        "decada": 2010,
        "titulo": "2010",
        "subtitulo": "NOVAS VOZES, NOVOS CAMINHOS",
        "botao": {
        "texto": "EXPLORAR DÉCADA",
        "icone": "./assets/img/arrow-right.svg",
        "acao": "openModal(4)"
        }
    }
    ]

    function createCards(){
        let cards_container = document.getElementById('cards-container');
    
        cards.forEach(el => {
            let HTML = `
                <div class="card" id="${el.id}">
                    <h1>${el.titulo}</h1>
                    <p class="p">${el.subtitulo}</p>
                    <div class="btn-card" onclick="${el.botao.acao}">
                        <p>${el.botao.texto}</p>
                        <img src="${el.botao.icone}">
                    </div>
                </div>
            `
    
            cards_container.innerHTML += HTML;
        });
    }

    let modais = [
        {
            "id": "modal1970",
            "content": {
            "title": "1970",
            "subtitle": "O NASCIMENTO DO SAMBA MODERNO",
            "texts": [
                "A década de 1970 marca o ponto de partida do samba moderno. Em meio às rodas de samba do bloco Cacique de Ramos, no Rio de Janeiro, músicos como Bira Presidente, Sereno, Ubirany e Almir Guineto começaram a reinventar a linguagem do gênero.",
                "Instrumentos como o tantã, o repique de mão e o banjo passaram a integrar as rodas, criando uma sonoridade mais urbana, mais percussiva e mais próxima das comunidades suburbanas. Mais do que música, o samba dessa época se consolidou como espaço de encontro, resistência cultural e identidade popular."
            ]
            }
        },
        {
            "id": "modal1980",
            "content": {
            "title": "1980",
            "subtitle": "A CONSOLIDAÇÃO DAS ESCOLAS",
            "texts": [
                "Nos anos 1980, o samba alcança uma nova dimensão popular. O sucesso de grupos como Fundo de Quintal, Zeca Pagodinho e Jorge Aragão ajuda a consolidar uma identidade moderna para o gênero.",
                "As escolas de samba expandem sua presença cultural, os desfiles se tornam espetáculos televisivos e o samba passa a ocupar um espaço ainda maior na indústria musical brasileira. É também nesse período que o pagode se fortalece como linguagem urbana das periferias e subúrbios cariocas."
            ]
            }
        },
        {
            "id": "modal1990",
            "content": {
            "title": "1990",
            "subtitle": "A ERA DOS FESTIVAIS",
            "texts": [
                "A década de 1990 marcou a explosão comercial do samba e do pagode. Grupos como Raça Negra, Só Pra Contrariar, Exaltasamba e Art Popular levaram o gênero às rádios, televisões e grandes eventos nacionais.",
                "O samba passou a dialogar diretamente com a cultura pop brasileira, aproximando novas gerações e expandindo sua presença para além do Rio de Janeiro. Enquanto isso, o samba tradicional seguia vivo nas rodas suburbanas e nos encontros comunitários que preservavam suas raízes."
            ]
            }
        },
        {
            "id": "modal2000",
            "content": {
            "title": "2000",
            "subtitle": "O SAMBA CHEGA AO NOVO MILÊNIO",
            "texts": [
                "Nos anos 2000, o samba passou por uma fase de renovação estética e cultural. Novos artistas surgiram enquanto nomes históricos permaneciam influentes no cenário nacional.",
                "As rodas de samba voltaram a ganhar força como espaços de encontro, celebração e preservação da memória musical brasileira. Ao mesmo tempo, o gênero começou a dialogar com a internet, novas mídias e públicos cada vez mais diversos."
            ]
            }
        },
        {
            "id": "modal2010",
            "content": {
            "title": "2010",
            "subtitle": "NOVAS VOZES, NOVOS CAMINHOS",
            "texts": [
                "Nos anos 2000, o samba passou por uma fase de renovação estética e cultural. Novos artistas surgiram enquanto nomes históricos permaneciam influentes no cenário nacional.",
                "As rodas de samba voltaram a ganhar força como espaços de encontro, celebração e preservação da memória musical brasileira. Ao mesmo tempo, o gênero começou a dialogar com a internet, novas mídias e públicos cada vez mais diversos."
            ]
            }
        }
    ]

    function createModals(){
        let modal_background = document.getElementById('modalBackground');

        modais.forEach(el => {
            let HTML = `
                <div class="modal-content-container none">
                    <div class="modal-content">
                        <div class="modal" id="${el.id}">
                            <div class="modal-title">
                                <h1>${el.content.title}</h1>
                            </div>
                            <div class="modal-subtitle">
                                <h2>${el.content.subtitle}</h2>
                                <img src="./assets/img/particao.svg">
                            </div>
                            <div class="modal-text">
                                <p>${el.content.texts[0]}</p>
                                <br>
                                <p>${el.content.texts[1]}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `
            modal_background.innerHTML += HTML;
        })

    }

    createModals();
    createCards();
</script>
</html>
